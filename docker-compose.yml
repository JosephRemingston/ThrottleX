version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:7-alpine
    container_name: throttleux-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: throttleux
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - throttleux-network

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: throttleux-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - throttleux-network

  # ThrottleX API Service
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: throttleux-api
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/throttleux
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev_access_token_secret_min_32_chars_xxxxxxxxxx}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_token_secret_min_32_chars_xxxxxxxxxxx}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-dummy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-dummy}
      AWS_SES_REGION: ${AWS_SES_REGION:-us-east-1}
      AWS_SES_SOURCE_EMAIL: ${AWS_SES_SOURCE_EMAIL:-noreply@example.com}
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - throttleux-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  throttleux-network:
    driver: bridge
